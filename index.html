function dashboard(){let waiting=s.qcRecords.filter(x=>x.result==='待检').length,arr=s.retests.filter(x=>x.result==='待复检'&&validDate(x.due)<8).length,fr=s.stock.filter(x=>x.frozen).length;let at=s.audit.slice(0,6);return hd('仓储工作台','以批次库存为中心汇总仓储待办、质检复检节点及人工例外记录',btn('新建收货','newReceipt','')+btn('新建出库','newOrder','secondary'),'WMS · V0.3')+`<div class="grid grid4 kpis">${metric('在库总量',fmt(sum(s.stock,'qty'))+' kg','库存基本单位统一核算')}${metric('在库批次数',s.lots.filter(x=>totalLot(x.id)>0).length,'按物料与批次独立管理')}${metric('待检 / 复检事项',waiting+' / '+arr,'人工登记质量结论')}${metric('冻结库存明细',fr+' 条','可按权限例外处理')}</div>`+panel('第一阶段主要业务流程',diagram([['收货 / 批次','确认实物与来源'],['质检与让步','质检员登记结论'],['上架 / 托盘','库管员人工选择'],['在库 / 复检','状态提醒与记录'],['人工选批出库','核对数量与位置'],['库存 / 追溯','库存流水及审计']]))+`<div class="grid grid2">${panel('当前待办',table(['事项','关联对象','状态','入口'],[...s.qcRecords.filter(x=>x.result==='待检').map(x=>tr(['入库待检',x.lot,pill(x.result),btn('处理','openQC:'+x.id)])),...s.retests.filter(x=>x.result==='待复检').map(x=>tr(['到期复检',x.lot,pill('待复检'),btn('处理','openRetest:'+x.id)])),...s.orders.filter(x=>x.status!=='已完成').map(x=>tr(['出库任务',x.id,pill(x.status),btn('查看','order:'+x.id)]))].slice(0,8)))}${panel('人工授权与记录',`<div class="info">系统提示质量、效期、冻结等异常，由具备权限的人员决定是否让步。<b>原检验结论不被让步覆盖</b>，例外操作关联数量及业务单据。</div><div class="cards"><div class="listCard"><strong>质量结论</strong><small>由质检员登记，不计算实验指标</small></div><div class="listCard"><strong>仓库执行</strong><small>库管员人工选择库位和批次</small></div><div class="listCard"><strong>例外放行</strong><small>保留权限、原因、数量和历史</small></div></div><div style="margin-top:15px">${btn('查看让步记录','go:concession')}${btn('查看库存异常','go:alerts')}</div>`)} </div>`+panel('最新操作记录',table(['时间','操作','摘要','人员'],at.map(x=>tr([x.time,x.kind,esc(x.desc),x.by]))))}
function materials(){return hd('物料档案','以参考系统物料基础字段为依据，保留精细化工属性和 SDS 信息',btn('包装与单位','go:packs'))+panel('物料基础资料',filterBar()+table(['物料编号','名称','物料类别','库存单位','危化品/储存信息','复检周期','SDS','操作'],s.materials.filter(x=>match(x.id,x.name,x.category)).map(x=>tr([x.id,x.name,x.category,x.unit,x.danger,x.retestMonths+'个月',x.sds,btn('详情','mat:'+x.id)]))))}
function packs(){return hd('包装方式与单位换算','参考系统的包装方式、每件净重/皮重与库存使用单位字段；支持实际称重折算',btn('演示换算','unitCalc',''))+panel('包装规格',table(['包装代码','包装方式','分类','每件标准净重','皮重','业务单位','示例换算'],s.packs.map(x=>tr([x.id,x.name,x.kind,fmt(x.std)+'kg',x.tare+'kg',x.unit,'1 '+x.unit+' ≈ '+x.std+'kg']))))+panel('基本口径',`<div class="info">演示库存统一使用 <b>kg</b> 记账，同时保留包装件数、业务单位和实际称重数量。实际换算优先使用业务人员确认的实重；固定规格可按标准件重计算。</div>`)}
function locations(){let o=s.locations.map(x=>({x,qty:sum(s.stock.filter(y=>y.loc===x.id),'qty')}));return hd('组织、仓库与库位','支持南京、吉林多仓数据视角；库管员自主选择存储位置，系统记录最终位置')+panel('仓储位置台账',table(['库位编号','仓库','位置类型','库存重量','位置容量','占用情况','操作'],o.map(({x,qty})=>tr([x.id,x.warehouse,pill(x.kind),fmt(qty)+' kg',fmt(x.capacity)+' kg',`<div class="chartBar"><span style="width:${Math.min(100,qty/x.capacity*100)}%"></span></div>`,btn('查看库存','loc:'+x.id)]))))+panel('储存判断机制',`<div class="info warn">危险属性、储存要求和现场禁忌由企业人员按制度人工判断；系统提供信息，不内置复杂化学品相容性自动拦截。示例数据不可用于实际危险化学品储存决策。</div>`)}
function batches(){return hd('批次档案与批次库存','新系统核心能力：同物料多批次、批次跨库位/托盘、质量记录与流转关联',btn('创建批次收货','newReceipt',''))+panel('批次列表',filterBar()+table(['内部批次','物料','库存','最近质量状态','生产日期','有效期至','复检日期','位置数','操作'],s.lots.filter(x=>match(x.id,x.mat,mat(x.mat).name)).map(x=>tr([`<button class="ref" data-act="batch:${x.id}">${x.id}</button>`,mat(x.mat).name,fmt(totalLot(x.id))+' kg',pill(x.qc),x.made,x.expiry,x.retest,s.stock.filter(z=>z.lot===x.id&&z.qty>0).length,btn('批次详情','batch:'+x.id)]))))}
function qcPage(){return hd('质检节点与结论','仅记录入库质检节点、结论和关联批次；不管理检验方法、指标及实验过程',btn('入库单据','go:inbound'))+panel('质检任务记录',table(['节点编号','关联批次','物料','节点类型','人工结论','判定人','日期','操作'],s.qcRecords.map(x=>tr([x.id,`<button class="ref" data-act="batch:${x.lot}">${x.lot}</button>`,mat(lot(x.lot).mat).name,x.kind,pill(x.result),x.by,x.date,btn('登记结论','openQC:'+x.id)]))))+panel('职责边界',`<div class="info">质检员登记合格、不合格或待处理等事实；仓储作业由库管员执行。待检或不合格并非不可越过的系统硬拦截，授权让步须保留原结论与操作原因。</div>`)}
function retestPage(){return hd('复检节点管理','按批次复检日期形成提醒；质检员人工登记复检结论，人工决定后续处置',btn('效期预警','go:alerts'))+panel('复检清单',table(['复检任务','批次','物料','计划日期','剩余天数','复检结论','执行人','操作'],s.retests.map(x=>tr([x.id,`<button class="ref" data-act="batch:${x.lot}">${x.lot}</button>`,mat(lot(x.lot).mat).name,x.due,(validDate(x.due)||0)+'天',pill(x.result),x.by,btn('登记 / 查看','openRetest:'+x.id)]))))+panel('状态流转说明',diagram([['复检提醒','仅提示到期'],['人工复检','不管理实验过程'],['结论登记','质检员记录结果'],['人工处置','继续使用/冻结/让步']]))}
function concessions(){return hd('让步与例外操作记录','保留检验原始结论，按批次、业务、数量追踪授权操作',btn('查看出库','go:outbound'))+panel('人工例外台账',table(['编号','关联批次','操作类型','数量','原因','授权人员','关联单据','时间'],s.concessions.map(x=>tr([x.id,x.lot,x.kind,fmt(x.qty)+' kg',esc(x.reason),x.by,x.ref,x.time]))))+panel('规则说明',`<div class="info warn"><b>授权让步 ≠ 修改质检结果。</b> 例外操作可用于待检、不合格、复检逾期及冻结等场景；仅具备对应权限人员可批准，原结果、数量和库存流水保留。</div>`)}
function inbound(){return hd('入库单据','采购、生产及其他入库使用统一主子表模式；批次可在实际收货时确定',btn('＋ 新建收货入库','newReceipt',''))+panel('入库业务单据',filterBar()+table(['单据编号','业务类型','物料','入库批次','实收数量','业务日期','执行状态','详情'],s.receipts.filter(x=>match(x.id,x.lot,mat(x.mat).name)).map(x=>tr([x.id,x.kind,mat(x.mat).name,x.lot,fmt(x.qty)+' kg',x.date,pill(x.status),btn('详情','receipt:'+x.id)]))))+panel('单据与现场作业关系',diagram([['单据登记','来源方式暂不定义'],['实收登记','支持多批次'],['质检节点','待检/人工结论'],['上架执行','人工库位与托盘'],['库存入账','记录实际数量']]))}
function receiving(){let pending=s.stock.filter(x=>x.loc==='待检-01'&&x.qty>0);return hd('收货与上架执行','待检也允许授权人工让步上架；目标库位由仓储人员人工选择',btn('新建收货','newReceipt',''))+panel('待上架库存',table(['库存明细','物料','批次','当前库位','待上架重量','质量状态','执行'],pending.map(x=>tr([x.id,mat(lot(x.lot).mat).name,x.lot,x.loc,fmt(x.qty)+' kg',pill(lot(x.lot).qc),btn('人工上架','put:'+x.id,'')]))))+panel('上架原则',`<div class="info">物料批次及实收数量与库存明细绑定。位置选择、仓储安全核查由库管员人工负责；待检或不合格状态下上架需要记录授权让步，不自动把质检结论变成合格。</div>`)}
function outbound(){return hd('出库业务单据','销售、生产领用、其他出库和采购退货；单据来源暂不确定',btn('＋ 新建出库单','newOrder',''))+panel('出库单列表',filterBar()+table(['出库单号','类型','物料','计划数量','已分配数量','状态','业务日期','详情'],s.orders.filter(x=>match(x.id,mat(x.mat).name)).map(x=>tr([x.id,x.kind,mat(x.mat).name,fmt(x.qty)+' kg',fmt(sum(x.lines,'qty'))+' kg',pill(x.status),x.date,btn('打开单据','order:'+x.id)]))))+panel('出库主流程',diagram([['业务登记','物料与数量'],['人工选批','展示日期/状态'],['例外授权','必要时记录'],['拣货复核','扫码/数量复核'],['实际出库','一次性库存扣减']]))}
function picking(){let orders=s.orders.filter(x=>x.status!=='已完成');return hd('拣货、复核与出库','人工指定具体批次、库位和数量，不执行强制 FEFO 排序',btn('新建出库','newOrder',''))+panel('待执行出库单',table(['单据号','物料','计划数量','已分配量','状态','执行'],orders.map(x=>tr([x.id,mat(x.mat).name,fmt(x.qty)+'kg',fmt(sum(x.lines,'qty'))+'kg',pill(x.status),btn('打开','order:'+x.id)]))))+panel('执行控制',`<div class="info">分配时保留预留量；完成出库复核后统一扣减库存。重复点击不会再次扣账。异常质量、效期、冻结库存允许授权后继续出库，并记录例外原因和原始状态。</div>`)}
function stock(){return hd('库存明细与库存状态','细化到批次 × 库位 × 托盘 × 状态，可直接查看或执行冻结、移库、组托',btn('盘点','go:count'))+panel('批次库位库存',filterBar()+table(['库存记录','仓库 / 库位','物料','批次','托盘','包装','件数','账面数量','预留','状态','操作'],s.stock.filter(x=>x.qty>0&&match(x.id,x.lot,x.loc,mat(lot(x.lot).mat).name)).map(x=>tr([x.id,loc(x.loc).warehouse+' / '+x.loc,mat(lot(x.lot).mat).name,`<button class="ref" data-act="batch:${x.lot}">${x.lot}</button>`,x.pallet||'散存',pack(x.pack).name,x.pieces,fmt(x.qty)+'kg',fmt(x.reserved)+'kg',pill(x.frozen?'冻结':'正常'),btn('详情 / 操作','stock:'+x.id)]))))+panel('数量口径',`<div class="info">账面库存量 = 所有在库数量汇总；可分配数量 = 账面数量 - 已预留数量（质量或冻结状态仅提示风险，不自动清零）。例外处置须使用有权限身份。</div>`)}
function transfer(){return hd('移库与调拨','库管员手工选择来源库存及目标位置，批次与托盘关联保持一致',btn('库存明细','go:stock'))+panel('执行入口',table(['库存记录','物料','批次','当前库位','托盘','数量','操作'],s.stock.filter(x=>x.qty>0).map(x=>tr([x.id,mat(lot(x.lot).mat).name,x.lot,x.loc,x.pallet||'散存',fmt(x.qty)+' kg',btn(x.pallet?'单笔移库':'移库','move:'+x.id)]))))+panel('调拨管理说明',`<div class="info">可跨同仓库库位或不同仓库位置执行移动，实际库存位置与业务流水同步更新；原批次身份不因移库改变。</div>`)}
function pallets(){let rows=s.pallets.map(x=>({...x,st:s.stock.filter(z=>z.pallet===x.id&&z.qty>0)}));return hd('托盘、组托与拆托','托盘实体编码与“托盘包装类型”分别管理；支持同托盘多批次/包装明细',btn('＋ 新建托盘','newPallet','')+btn('＋ 组托','groupPallet','secondary'))+panel('托盘档案与库存',table(['托盘号','状态','当前库位','批次 / 物料条目','在托数量','操作'],rows.map(x=>tr([x.id,pill(x.state),[...new Set(x.st.map(z=>z.loc))].join('、')||'空托',x.st.length,fmt(sum(x.st,'qty'))+' kg',btn('详情 / 拆托','pallet:'+x.id)]))))+panel('托盘说明',`<div class="info">组托与拆托改变托盘关联关系，不凭空增加或减少库存数量；移动整托时，同步变更所有托盘明细的库位。</div>`)}
function counts(){return hd('库存盘点与差异处理','按批次/库位/托盘核对实物，盘盈盘亏由人工确认后更新库存',btn('＋ 新建盘点','newCount',''))+panel('盘点记录',table(['盘点单号','关联库存','批次','账面快照','实盘数量','差异','状态','执行人'],s.counts.map(x=>tr([x.id,x.stockId,x.lot,fmt(x.book)+'kg',fmt(x.actual)+'kg',fmt(x.actual-x.book)+'kg',pill(x.status),x.by]))))+panel('盘点规则',diagram([['确定盘点对象','按库位或批次'],['登记实盘数量','现场扫码/录入'],['形成账实差异','展示差异量'],['人工确认调整','记录盈亏与人员']]))}
function alerts(){let risks=s.lots.map(x=>({x,exp:validDate(x.expiry),retest:validDate(x.retest)})).filter(x=>totalLot(x.x.id)>0&&(x.exp<=90||x.retest<=30||x.x.qc!=='合格'));return hd('效期、复检与库存异常提醒','提醒不自动冻结、报废或禁止流转，由业务人员按实际情况处置',btn('复检节点','go:retest'))+panel('批次风险与待办',table(['批次','物料','质量结论','效期日/剩余','复检日/剩余','在库数量','处理入口'],risks.map(({x,exp,retest})=>tr([x.id,mat(x.mat).name,pill(x.qc),x.expiry+' / '+exp+'天',x.retest+' / '+retest+'天',fmt(totalLot(x.id))+'kg',btn('查看批次','batch:'+x.id)]))))+panel('控制边界',`<div class="info warn">系统仅提示临期、复检到期与库存质量状态；不自动得出是否可用的业务结论。授权继续使用、冻结或例外出库可分别留痕。</div>`)}
function samples(){return hd('样品基础仓储管理','记录样品登记、存放、出入库及期限；不管理实验和检验过程',btn('＋ 新增样品','newSample',''))+panel('样品台账',table(['样品号','物料','关联批次','样品数量','存放位置','保存期限','状态','操作'],s.samples.map(x=>tr([x.id,mat(x.mat).name,x.lot,fmt(x.qty),x.loc,x.until,pill(x.status),btn('领用 / 退回','sample:'+x.id)]))))}
function trace(){
 const b=lot(traceLot);
 const events=s.ledger.filter(x=>x.lot===traceLot);
 const qualityRows=[
  ...s.qcRecords.filter(x=>x.lot===traceLot).map(x=>tr([x.kind,pill(x.result),x.date,x.by])),
  ...s.retests.filter(x=>x.lot===traceLot).map(x=>tr(['复检',pill(x.result),x.date||x.due,x.by])),
  ...s.concessions.filter(x=>x.lot===traceLot).map(x=>tr([x.kind,esc(x.reason),x.time,x.by]))
 ];
 const eventRows=events.map(x=>tr([x.time,x.kind,(x.qty>0?'+':'')+fmt(x.qty)+'kg',x.loc||'—',x.ref||'—']));
 const selector=`<div class="filters"><select class="sel" id="traceSelect">${s.lots.map(x=>`<option value="${x.id}" ${x.id===traceLot?'selected':''}>${x.id} · ${mat(x.mat).name}</option>`).join('')}</select>${btn('查询','traceGo','')}</div>`;
 const info=kv([['物料',mat(b.mat).name],['批次',b.id],['在库量',fmt(totalLot(b.id))+' kg'],['最近质检/复检',b.qc],['来源单据',b.source],['库存位置',s.stock.filter(x=>x.lot===b.id&&x.qty>0).map(x=>x.loc).join('、')||'无']]);
 return hd('批次正反向仓储追溯','以真实出入库、库存变动、检验结论和人工让步记录为证据',btn('批次总览','go:batches'))
 +panel('选择批次',selector)+panel('批次概要',info)
 +`<div class="grid grid2">${panel('质量与让步',table(['记录类别','结论 / 操作','日期','人员'],qualityRows))}${panel('库存流转记录',table(['日期','动作','数量变化','位置','关联单据'],eventRows))}</div>`;
}
function reports(){let rows=s.materials.map(x=>({x,items:s.stock.filter(z=>lot(z.lot).mat===x.id)}));return hd('库存统计与仓储报表','按物料及批次查看库存和相关业务统计，提供简化 CSV 导出',btn('导出当前汇总','csv',''))+`<div class="grid grid3 kpis">${metric('库存基本单位总量',fmt(sum(s.stock,'qty'))+' kg','仅统计在库')}${metric('库存记录数',s.stock.filter(x=>x.qty>0).length,'含批次、库位、托盘维度')}${metric('已记录人工例外',s.concessions.length,'每次例外单独留痕')}</div>`+panel('库存分类汇总',table(['物料编号','物料名称','批次数','总库存','预留数量','冻结库存','明细'],rows.map(({x,items})=>tr([x.id,x.name,new Set(items.map(z=>z.lot)).size,fmt(sum(items,'qty'))+'kg',fmt(sum(items,'reserved'))+'kg',fmt(sum(items.filter(z=>z.frozen),'qty'))+'kg',btn('库存明细','go:stock')]))))}

function renderOverlay(){document.querySelectorAll('.drawerMask,.modalMask').forEach(x=>x.remove());if(detail)document.body.insertAdjacentHTML('beforeend',drawerRender());if(modal)document.body.insertAdjacentHTML('beforeend',modal)}
const pages={dashboard,materials,packs,locations,batches,qc:qcPage,retest:retestPage,concession:concessions,inbound,receiving,outbound,picking,stock,transfer,pallets,count:counts,alerts,samples,trace,reports,audit,users};
function render(){document.getElementById('root').innerHTML=`<div class="app"><aside class="nav"><div class="brand">◈ 精细化工 WMS<small>BATCH / PALLET / MANUAL RELEASE · V0.3</small></div>${navbar()}</aside><div class="main"><header class="topbar"><div class="bread">仓储管理 / <b>${pathTitle()}</b></div><div class="topActions"><span class="roleLabel">演示身份</span><select class="sel roleSel" id="roleSwitch">${ROLE_LIST.map(x=>`<option value="${x}" ${s.role===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn secondary xs" data-act="reset">恢复样例</button></div></header><main class="content">${pages[route]()}<div class="foot">精细化工 WMS · V0.3 交互业务原型 ｜ 演示数据 ｜ 无外部系统对接 ｜ 非生产或安全控制系统</div></main></div></div>`;renderOverlay()}
function toast(t){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3400)}
function go(r){route=r;search='';detail=null;modal=null;render();window.scrollTo({top:0,behavior:'instant'})}
function recalcPallet(id){let p=s.pallets.find(x=>x.id===id);if(p)p.state=s.stock.some(x=>x.pallet===id&&x.qty>0)?'在用':'空托'}
function addStock(from,qty,updates){let target=s.stock.find(x=>x.lot===from.lot&&x.loc===(updates.loc??from.loc)&&x.pallet===(updates.pallet??from.pallet)&&x.pack===from.pack&&x.frozen===from.frozen&&x.id!==from.id);if(target){target.qty+=qty;target.pieces+=from.qty>0?from.pieces*qty/(from.qty+qty):0;return target}let next={...from,id:'ST-'+(++s.seq),qty, reserved:0,pieces:Math.round((from.pieces||1)*qty/Math.max(from.qty+qty,qty)*100)/100,...updates};s.stock.push(next);return next}
function exception(kind,x,qty,reason,ref){s.concessions.unshift({id:'RB-'+(++s.seq),lot:x.lot,kind,qty,reason,by:s.role,ref,time:cur(),originalQC:lot(x.lot).qc,originalFrozen:x.frozen});pushLog(kind,`${x.lot} ${fmt(qty)}kg；原质量状态：${lot(x.lot).qc}；原冻结状态：${x.frozen?'冻结':'正常'}；原因：${reason}`,x.lot,0,x.loc,ref)}
function handleForm(id,f){let d=Object.fromEntries(new FormData(f).entries()),n=k=>Number(d[k]||0),why=(d.note||d.reason||'').trim(),bad=m=>{toast(m);return false};let x, b, o;
if(id==='formReceipt'){if(!(n('qty')>0&&n('pieces')>0))return bad('收货数量和件数应大于0');if(s.lots.some(z=>z.id===d.lot))return bad('批次号已存在，请选择新批次编号');let ref='RK-'+(++s.seq);s.lots.unshift({id:d.lot,mat:d.mat,source:ref,made:d.made,expiry:d.expiry,retest:d.retest,qc:'待检',lastResult:'待检',supplier:'演示来源'});s.stock.unshift({id:'ST-'+(++s.seq),lot:d.lot,loc:'待检-01',pallet:'',pack:d.pack,pieces:n('pieces'),qty:n('qty'),frozen:false,reserved:0});s.receipts.unshift({id:ref,kind:d.kind,mat:d.mat,lot:d.lot,qty:n('qty'),status:'待质检/上架',date:TODAY});s.qcRecords.unshift({id:'QC-'+(++s.seq),lot:d.lot,kind:'入库质检',result:'待检',by:'—',date:TODAY,note:why});pushLog('新增收货',`${ref} / ${d.lot} / ${n('qty')}kg`,d.lot,n('qty'),'待检-01',ref);go('receiving');toast('收货已记录，并建立待检批次及质检节点');return true}
if(id==='formOrder'){if(!(n('qty')>0))return bad('出库数量应大于0');let ref='CK-'+(++s.seq);s.orders.unshift({id:ref,kind:d.kind,mat:d.mat,qty:n('qty'),status:'待分配',lines:[],date:TODAY});pushLog('创建出库单',ref+' / '+mat(d.mat).name+' / '+n('qty')+'kg');go('outbound');toast('出库单已建立，请人工选择批次');return true}
if(id==='formQC'){if(!canQC())return bad('当前角色无权登记质检结论，请在顶栏切换至质检员');let q=s.qcRecords.find(x=>x.id===d.id);q.result=d.result;q.by=s.role;q.date=TODAY;q.note=d.note;lot(q.lot).qc=d.result;lot(q.lot).lastResult=d.result;pushLog('质检结论登记',`${q.lot}：${d.result}；${d.note||'无补充说明'}`,q.lot,0,'',q.id);go('qc');toast('已保存人工质检结论，未自动冻结或强制拦截仓储作业');return true}
if(id==='formRetest'){if(!canQC())return bad('当前角色无权登记复检结论');let q=s.retests.find(x=>x.id===d.id);q.result=d.result;q.by=s.role;q.date=d.date;lot(q.lot).qc=d.result==='合格'?'合格':d.result;lot(q.lot).retest=d.next;pushLog('复检结论登记',`${q.lot}：${d.result}；下次复检 ${d.next}`,q.lot,0,'',q.id);go('retest');toast('复检结论已登记，后续处置由人工决定');return true}
if(id==='formPut'){if(!canWarehouse())return bad('当前角色无权执行上架');x=stk(d.stockId);if(!(n('qty')>0&&n('qty')<=available(x)))return bad('上架数量超过可执行数量');let risk=risky(x);if(risk.length&&!canApprove())return bad('此批次存在异常，请先切换到“授权放行人员”或“仓库主管”执行例外确认');if(risk.length&&!why)return bad('特殊上架必须填写让步/例外原因');if(risk.length)exception('让步上架',x,n('qty'),why,'上架执行');let old=x.loc,amount=n('qty'),ratio=amount/x.qty,pieces=x.pieces*ratio;if(amount===x.qty){x.loc=d.loc}else{x.qty-=amount;x.pieces-=pieces;s.stock.push({...x,id:'ST-'+(++s.seq),loc:d.loc,pallet:'',qty:amount,pieces,reserved:0})}let receipt=s.receipts.find(z=>z.lot===x.lot);if(receipt)receipt.status='已完成';pushLog('人工上架',`${x.lot} ${fmt(amount)}kg：${old} → ${d.loc}`,x.lot,0,d.loc,receipt?.id||'');go('stock');toast('上架完成：保留原批次质量结论，库存位置已更新');return true}
if(id==='formAllocate'){o=s.orders.find(x=>x.id===d.orderId);x=stk(d.stockId);let remain=o.qty-sum(o.lines,'qty');if(!x||lot(x.lot).mat!==o.mat)return bad('请选择该物料的库存');if(!(n('qty')>0&&n('qty')<=Math.min(remain,available(x))))return bad('分配数量超过未分配量或库存余额');let risk=risky(x);if(risk.length&&!canApprove())return bad('当前库存存在异常。请切换至授权放行人员或仓库主管，并登记放行原因');if(risk.length&&!String(d.reason||'').trim())return bad('异常库存例外分配必须填写原因');if(risk.length)exception('出库例外放行',x,n('qty'),d.reason,o.id);x.reserved+=n('qty');o.lines.push({stockId:x.id,lot:x.lot,loc:x.loc,qty:n('qty'),picked:false});o.status='待拣货';pushLog('人工批次分配',`${o.id} 手工选 ${x.lot}/${x.loc} ${fmt(n('qty'))}kg${risk.length?'（授权例外）':''}`,x.lot,0,x.loc,o.id);modal=null;detail='order|'+o.id;render();toast('库存已预留，可继续分配或拣货；出库时才扣减账面量');return true}
if(id==='formFreeze'){if(!canApprove())return bad('仅仓库主管/授权放行人员可冻结或解冻');x=stk(d.stockId);if(!why)return bad('请输入状态变更原因');let old=x.frozen;x.frozen=!x.frozen;pushLog(x.frozen?'库存冻结':'库存解冻',`${x.lot} ${fmt(x.qty)}kg；${old?'冻结':'正常'} → ${x.frozen?'冻结':'正常'}；原因：${why}`,x.lot,0,x.loc,x.id);detail='stock|'+x.id;modal=null;render();toast('状态变更已记录（不改变库存数量）');return true}
if(id==='formMove'){if(!canWarehouse())return bad('当前角色无权移库');x=stk(d.stockId);if(x.pallet)return bad('请使用整托移动或拆托后移动');if(!(n('qty')>0&&n('qty')<=available(x)))return bad('移动数量不合法或已被出库预留');if(x.loc===d.loc)return bad('目标库位不能与来源相同');let from=x.loc,amount=n('qty');if(amount===x.qty){x.loc=d.loc}else{let parts=x.pieces*amount/x.qty;x.qty-=amount;x.pieces-=parts;s.stock.push({...x,id:'ST-'+(++s.seq),qty:amount,pieces:parts,loc:d.loc,reserved:0})}pushLog('库存移库',`${x.lot} ${fmt(amount)}kg：${from} → ${d.loc}`,x.lot,0,d.loc,x.id);go('stock');toast('移库完成，批次身份与流水已保留');return true}
if(id==='formPallet'){if(s.pallets.some(x=>x.id===d.id))return bad('托盘编号重复');s.pallets.push({id:d.id,type:d.type,state:'空托'});pushLog('新建托盘',d.id);go('pallets');toast('托盘已建立');return true}
if(id==='formGroup'){if(!canWarehouse())return bad('当前角色无权组托');x=stk(d.stockId);if(!x||x.pallet)return bad('请选择散存库存');if(!(n('qty')>0&&n('qty')<=available(x)))return bad('组托数量超出可用实存');let other=s.stock.find(z=>z.pallet===d.pallet&&z.qty>0);if(other&&other.loc!==x.loc)return bad('同一托盘当前位于其他库位，请先移库再组托');let amt=n('qty'),pieces=x.pieces*amt/x.qty;if(amt===x.qty){x.pallet=d.pallet}else{x.qty-=amt;x.pieces-=pieces;s.stock.push({...x,id:'ST-'+(++s.seq),pallet:d.pallet,qty:amt,pieces,reserved:0})}recalcPallet(d.pallet);pushLog('组托',`${d.pallet} 绑定 ${x.lot} ${fmt(amt)}kg`,x.lot,0,x.loc,d.pallet);go('pallets');toast('组托完成，批次总库存未发生增减');return true}
if(id==='formSplit'){if(!canWarehouse())return bad('当前角色无权拆托');x=stk(d.stockId);if(!x?.pallet)return bad('不是托盘库存');if(!(n('qty')>0&&n('qty')<=available(x)))return bad('拆托数量不合法');let oldP=x.pallet,amt=n('qty'),pieces=x.pieces*amt/x.qty;if(amt===x.qty){x.pallet=''}else{x.qty-=amt;x.pieces-=pieces;s.stock.push({...x,id:'ST-'+(++s.seq),pallet:'',qty:amt,pieces,reserved:0})}recalcPallet(oldP);pushLog('拆托',`${oldP} 拆出 ${x.lot} ${fmt(amt)}kg`,x.lot,0,x.loc,oldP);go('pallets');toast('拆托完成，不改变批次总库存');return true}
if(id==='formMovePallet'){let p=d.pallet,rows=s.stock.filter(x=>x.pallet===p&&x.qty>0);if(!rows.length)return bad('空托盘无需移动库存');if(rows.some(x=>x.reserved>0))return bad('托盘包含已被出库预留的库存，请完成/取消分配后再移动');let old=rows[0].loc;rows.forEach(x=>{x.loc=d.loc;pushLog('整托移库',`${p}/${x.lot}：${old} → ${d.loc}`,x.lot,0,d.loc,p)});go('pallets');toast('整托移库完成，全部批次位置已同步');return true}
if(id==='formCount'){if(!canApprove())return bad('请切换为仓库主管或授权角色确认盘点差异');x=stk(d.stockId);if(!x)return bad('找不到盘点库存');if(n('actual')<x.reserved)return bad('实际库存小于已预留量，请先处理预留出库');let before=x.qty,diff=n('actual')-before,ref='PD-'+(++s.seq);s.counts.unshift({id:ref,stockId:x.id,lot:x.lot,book:before,actual:n('actual'),status:'已完成',by:s.role});x.qty=n('actual');pushLog(diff>=0?'盘盈调整':'盘亏调整',`${x.lot}：账面${fmt(before)}kg → 实盘${fmt(n('actual'))}kg；${why||'人工确认'}`,x.lot,diff,x.loc,ref);go('count');toast('盘点差异已调整并记入库存流水');return true}
if(id==='formSample'){s.samples.unshift({id:'YP-'+(++s.seq),mat:d.mat,lot:d.lot,qty:n('qty'),loc:d.loc,until:d.until,status:'在库'});pushLog('样品登记',`${d.lot} / ${fmt(n('qty'))}`);go('samples');toast('样品登记完成');return true}
if(id==='formSampleMove'){let p=s.samples.find(x=>x.id===d.id);if(d.kind==='样品领用'&&n('qty')>p.qty)return bad('样品在库数量不足');p.qty+=d.kind==='样品领用'?-n('qty'):n('qty');p.status=p.qty?'在库':'已领完';pushLog(d.kind,`${p.id} ${n('qty')}；${why}`);go('samples');toast('样品记录已更新');return true}
if(id==='formCalc'){let p=pack(d.pack),qty=n('actual')>0?n('actual'):n('pieces')*p.std;modal=null;renderOverlay();toast(`${p.name} ${n('pieces')}件 → ${fmt(qty)}kg（${n('actual')>0?'采用实际重量':'按标准件重换算'}）`);return true}return false}
function action(a){if(a==='close'){modal=null;detail=null;renderOverlay();return}if(a.startsWith('go:'))return go(a.slice(3));if(a.startsWith('batch:')||a.startsWith('order:')||a.startsWith('receipt:')||a.startsWith('stock:')||a.startsWith('pallet:')||a.startsWith('mat:')||a.startsWith('loc:')){let sep=a.indexOf(':'),type=a.slice(0,sep),id=a.slice(sep+1);detail=type+'|'+id;tab='stock';modal=null;renderOverlay();return}if(a.startsWith('tab:')){tab=a.slice(4);renderOverlay();return}if(a==='filter'){search=document.getElementById('query')?.value||'';render();return}if(a==='clearfilter'){search='';render();return}if(a==='traceGo'){traceLot=document.getElementById('traceSelect').value;render();return}if(a.startsWith('trace:')){traceLot=a.slice(6);return go('trace')}if(a==='reset'){if(!confirm('恢复全部初始演示数据？当前操作记录会清除。'))return;s=seed();persist();return go('dashboard')}if(a==='csv'){let rows=s.materials.map(x=>[x.id,x.name,sum(s.stock.filter(z=>lot(z.lot).mat===x.id),'qty')]);let csv='物料编号,物料名称,当前库存kg\n'+rows.map(x=>x.join(',')).join('\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download='WMS库存汇总V0.3.csv';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}if(a.startsWith('picked:')){let o=s.orders.find(x=>x.id===a.slice(7));if(!canWarehouse())return toast('请切换仓库作业角色');o.lines.forEach(x=>x.picked=true);o.status='待复核';pushLog('完成拣货',`${o.id} 全部批次明细扫码核对完成`);detail='order|'+o.id;renderOverlay();return}if(a.startsWith('ship:')){let o=s.orders.find(x=>x.id===a.slice(5));if(o.status==='已完成')return toast('已完成单据不能重复扣减');if(!o.lines.length||!o.lines.every(x=>x.picked))return toast('请先分配并完成拣货');if(sum(o.lines,'qty')<o.qty-.00001)return toast('分配总数小于出库单计划数量，请补充分配');if(o.lines.some(x=>!stk(x.stockId)||stk(x.stockId).qty<x.qty))return toast('库存不足，请核查库存明细');if(!canWarehouse())return toast('请切换仓库作业角色');o.lines.forEach(l=>{let x=stk(l.stockId);x.qty-=l.qty;x.reserved-=l.qty;x.pieces=Math.max(0,x.pieces*(x.qty/(x.qty+l.qty)));pushLog('出库扣减',`${o.id}：${l.lot}/${l.loc} -${fmt(l.qty)}kg`,l.lot,-l.qty,l.loc,o.id)});o.status='已完成';pushLog('出库单完成',`${o.id}：${fmt(o.qty)}kg，已复核并完成唯一扣减`);persist();detail='order|'+o.id;renderOverlay();toast('出库完成，账面库存已扣减且不能重复提交');return}if(a==='newReceipt'||a==='newOrder'||a==='newPallet'||a==='groupPallet'||a==='newCount'||a==='newSample'||a==='unitCalc'||a.startsWith('openQC:')||a.startsWith('openRetest:')||a.startsWith('put:')||a.startsWith('allocate:')||a.startsWith('freeze:')||a.startsWith('move:')||a.startsWith('groupOne:')||a.startsWith('split:')||a.startsWith('movePallet:')||a.startsWith('sample:'))return openModal(a);}
document.addEventListener('click',e=>{let r=e.target.closest('[data-route]');if(r)return go(r.dataset.route);let a=e.target.closest('[data-act]');if(a)return action(a.dataset.act);if(e.target.classList.contains('drawerMask')||e.target.classList.contains('modalMask')){modal=null;detail=null;renderOverlay()}});
document.addEventListener('change',e=>{if(e.target.id==='roleSwitch'){s.role=e.target.value;persist();render();toast('演示身份已切换：'+s.role)}});
document.addEventListener('submit',e=>{let fid=e.target.getAttribute('id')||'';if(!fid.startsWith('form'))return;e.preventDefault();handleForm(fid,e.target)});
render();
</script></body></html>
